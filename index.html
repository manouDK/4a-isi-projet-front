<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pol-eat-heck - Catalogue</title>

    <link rel="stylesheet" href="css/style.css">

    <script src="js/api.js" defer></script>
    <script src="js/auth.js" defer></script>
    <script src="js/pages/index.js" defer></script>
</head>
<body>
    <header class="site-header">
        <a href="index.html" class="logo">Pol-eat-heck</a>

        <nav aria-label="Navigation principale">
            <ul class="nav-links">
                <li><a href="index.html" aria-current="page">Catalogue</a></li>
                <li><a href="login.html">Connexion</a></li>
                <li><a href="register.html">Créer un compte</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Catalogue</h1>

        <section aria-labelledby="menus-title">
            <h2 id="menus-title">Menus</h2>
            <p id="menus-status" class="status" role="status">Chargement des menus…</p>
            <ul id="menus-list" class="card-list"></ul>
        </section>

        <section aria-labelledby="products-title">
            <h2 id="products-title">Produits</h2>
            <p id="products-status" class="status" role="status">Chargement des produits…</p>
            <ul id="products-list" class="card-list"></ul>
        </section>
    </main>

    <footer class="site-footer">
        <p>Pol-eat-heck · commande à l'avance, paiement sur place</p>
    </footer>
    
    <template id="menu-card-template">
        <li class="card">
            <h3 class="card-title"></h3>
            <p class="card-price"></p>
            <p class="card-dates"></p>
            <ul class="card-products"></ul>
        </li>
    </template>

    <template id="product-card-template">
        <li class="card">
            <h3 class="card-title"></h3>
            <p class="card-price"></p>
            <p class="card-availability"></p>
        </li>
    </template>
</body>
</html>
